services:
  - type: web
    name: stockpredictor-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: ALLOWED_ORIGINS
        fromService:
          name: stockpredictor-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: stockpredictor-web
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: VITE_API_BASE_URL
        fromService:
          name: stockpredictor-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
