services:
  - type: web
    name: stockpredictor-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: ALLOWED_ORIGINS
        value: https://stockpredictor-web.onrender.com

  - type: static
    name: stockpredictor-web
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: VITE_API_BASE_URL
        value: https://stockpredictor-api.onrender.com
